name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # WP can POST a repository_dispatch (type: rebuild) when a product is published.
  repository_dispatch:
    types: [rebuild]
  # Safety net: rebuild every 3 hours so WP content changes go live automatically.
  schedule:
    - cron: "0 */3 * * *"

concurrency:
  group: deploy
  # A scheduled run never kills a running one. The cron is a safety net for
  # content published in WordPress; a push is somebody shipping code. They
  # collided nine seconds apart once, the push was cancelled, the safety net
  # then failed on its own, and nothing reached the site for hours. Anything
  # else still supersedes: the newest content is the only content worth having.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        # Retried, because this build reads the live shop and is deliberately
        # unforgiving about the answers: a category page with no products looks
        # exactly like a category that is genuinely empty, so the fetch helpers
        # throw rather than publish a hollow site. That is right for a bad
        # response and wrong for a slow afternoon — a burst of rebuilds makes
        # WordPress answer late often enough to lose a deploy until the next
        # scheduled run, three hours later.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "Build attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          exit 1
        env:
          WP_URL: https://wp.gedushop.com
          NEXT_PUBLIC_WP_URL: https://wp.gedushop.com
          NEXT_PUBLIC_SITE_URL: https://gedushop.com
          NEXT_PUBLIC_GA_ID: G-SF6ZE96GFX
          NEXT_PUBLIC_FB_PIXEL_ID: "1050261897457451"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name gedushop --branch main --commit-dirty=true
