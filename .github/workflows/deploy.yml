name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # WP can POST a repository_dispatch (type: rebuild) when a product is published.
  repository_dispatch:
    types: [rebuild]
  # Safety net: rebuild every 3 hours so WP content changes go live automatically.
  schedule:
    - cron: "0 */3 * * *"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          WP_URL: https://wp.gedushop.com
          NEXT_PUBLIC_WP_URL: https://wp.gedushop.com
          NEXT_PUBLIC_SITE_URL: https://gedushop.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name gedushop --branch main --commit-dirty=true
